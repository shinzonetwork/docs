{# Scene for {% player(scene="journey") %}: the data's journey from an
   execution node through a Generator client, attestation at a Host, a Lens
   transform, and into an app. Per-step state lives in the inline <style>;
   motion (side packets) and the vote counter are declared via data-*. #}
<svg class="player__svg" viewBox="0 0 760 430" role="img"
  aria-label="Diagram of a signed document traveling from an execution node, through a Generator client, to a Host that tallies attestations, through a View transform, and into an application that verifies it.">
  <defs>
    <g id="j-gear-def">
      <circle r="9" style="fill: var(--color-primary);" />
      <rect x="-2" y="-13.5" width="4" height="5" rx="1" style="fill: var(--color-primary);" />
      <rect x="-2" y="-13.5" width="4" height="5" rx="1" style="fill: var(--color-primary);" transform="rotate(45)" />
      <rect x="-2" y="-13.5" width="4" height="5" rx="1" style="fill: var(--color-primary);" transform="rotate(90)" />
      <rect x="-2" y="-13.5" width="4" height="5" rx="1" style="fill: var(--color-primary);" transform="rotate(135)" />
      <rect x="-2" y="-13.5" width="4" height="5" rx="1" style="fill: var(--color-primary);" transform="rotate(180)" />
      <rect x="-2" y="-13.5" width="4" height="5" rx="1" style="fill: var(--color-primary);" transform="rotate(225)" />
      <rect x="-2" y="-13.5" width="4" height="5" rx="1" style="fill: var(--color-primary);" transform="rotate(270)" />
      <rect x="-2" y="-13.5" width="4" height="5" rx="1" style="fill: var(--color-primary);" transform="rotate(315)" />
      <circle r="3" style="fill: var(--background);" />
    </g>
  </defs>

  <!-- routes -->
  <path class="route" d="M 80 210 H 690" fill="none" />
  <path id="j-side-path-1" class="route route--side" d="M 273 70 C 320 70, 390 120, 424 178" fill="none" />
  <path id="j-side-path-2" class="route route--side" d="M 273 350 C 320 350, 390 300, 424 242" fill="none" />

  <text class="hint" x="332" y="188">P2P gossip</text>

  <!-- Execution node -->
  <g class="station" id="j-st-node" data-steps="1" transform="translate(80 210)">
    <rect class="box" x="-30" y="-30" width="60" height="60" rx="10" />
    <rect class="block" x="-14" y="-16" width="28" height="8" rx="2" />
    <rect class="block" x="-14" y="-4" width="28" height="8" rx="2" />
    <rect class="block" x="-14" y="8" width="28" height="8" rx="2" />
    <text class="label" y="52">Execution node</text>
  </g>

  <!-- Generator client -->
  <g class="station" id="j-st-gen" data-steps="2" transform="translate(255 210)">
    <circle class="box" r="30" />
    <use href="#j-gear-def" class="gear" />
    <text class="label" y="52">Generator client</text>
  </g>

  <!-- Other Generator clients -->
  <g class="station station--small" id="j-st-gen2" data-steps="4" transform="translate(255 70)">
    <circle class="box" r="18" />
    <g transform="scale(0.62)"><use href="#j-gear-def" class="gear" /></g>
    <text class="label label--small label--end" x="-28" y="4">Generator client</text>
  </g>
  <g class="station station--small" id="j-st-gen3" data-steps="4" transform="translate(255 350)">
    <circle class="box" r="18" />
    <g transform="scale(0.62)"><use href="#j-gear-def" class="gear" /></g>
    <text class="label label--small label--end" x="-28" y="4">Generator client</text>
  </g>

  <!-- Host -->
  <g class="station" id="j-st-host" data-steps="3,4" transform="translate(450 210)">
    <path class="box" d="M -26 -18 v 36 a 26 8 0 0 0 52 0 v -36 a 26 8 0 0 0 -52 0" />
    <ellipse class="box-lip" cx="0" cy="-18" rx="26" ry="8" />
    <text class="label" y="52">Host</text>
  </g>

  <!-- View / Lens transform: raw document in, structured document out -->
  <g class="station" id="j-st-lens" data-steps="5" transform="translate(565 210)">
    <rect class="box" x="-32" y="-14" width="18" height="24" rx="2" />
    <text class="gate-raw" x="-23" y="3">{ }</text>
    <path class="gate-arrow" d="M -9 0 H 9 M 4 -5 L 9 0 L 4 5" fill="none" />
    <rect class="box" x="14" y="-14" width="18" height="24" rx="2" />
    <path class="gate-lines" d="M 17 -6 H 29 M 17 0 H 29 M 17 6 H 24" fill="none" />
    <text class="label" y="52">Lens transform</text>
  </g>

  <!-- App -->
  <g class="station" id="j-st-app" data-steps="6" transform="translate(690 210)">
    <rect class="box" x="-30" y="-24" width="60" height="48" rx="8" />
    <circle class="dot-win" cx="-19" cy="-13" r="2.5" />
    <circle class="dot-win" cx="-11" cy="-13" r="2.5" />
    <circle class="dot-win" cx="-3" cy="-13" r="2.5" />
    <text class="label" y="48">Your app</text>
  </g>

  <!-- Attestation record card -->
  <g class="card" id="j-att-card" data-counter="votes" data-counter-steps="1,1,1,1,3,3" transform="translate(450 74)">
    <rect x="-100" y="-30" width="200" height="60" rx="10" />
    <text class="card-title" x="-88" y="-10">Attestation record</text>
    <text class="card-mono" x="-88" y="14">vote_count</text>
    <text class="card-mono num" x="10" y="14">1</text>
    <circle class="dot" cx="42" cy="10" r="5.5" />
    <circle class="dot" cx="60" cy="10" r="5.5" />
    <circle class="dot" cx="78" cy="10" r="5.5" />
  </g>

  <!-- GraphQL bubble + verified shield at the app -->
  <g class="card" id="j-query" transform="translate(660 84)">
    <rect x="-90" y="-32" width="180" height="58" rx="10" />
    <text class="card-title" x="-78" y="-10">GraphQL · TokenTransfer</text>
    <text class="card-mono" x="-78" y="12">attestation ≥ 3 ✓</text>
  </g>
  <g class="card" id="j-shield" transform="translate(650 152)">
    <path class="shield-body" d="M 0 -15 L 13 -9 V 4 C 13 13 7 18 0 21 C -7 18 -13 13 -13 4 V -9 Z" />
    <path class="shield-check" d="M -5 1 L -1 6 L 6 -5" fill="none" />
  </g>

  <!-- Travelling packets -->
  <g class="packet" id="j-side-1" opacity="0"
    data-fly="#j-side-path-1" data-fly-steps="4" data-fly-delay="350" data-fly-arrive="votes:2">
    <rect x="-13" y="-8" width="26" height="16" rx="4" />
    <circle class="seal-dot" cx="10" cy="-7" r="4" />
  </g>
  <g class="packet" id="j-side-2" opacity="0"
    data-fly="#j-side-path-2" data-fly-steps="4" data-fly-delay="1050" data-fly-arrive="votes:3">
    <rect x="-13" y="-8" width="26" height="16" rx="4" />
    <circle class="seal-dot" cx="10" cy="-7" r="4" />
  </g>

  <!-- Main packet: raw log + transformed view content, cross-faded -->
  <g class="packet packet--main" id="j-packet">
    <g id="j-packet-raw">
      <rect x="-23" y="-15" width="46" height="30" rx="6" />
      <text class="packet-text" y="4">{ }</text>
    </g>
    <g id="j-packet-view">
      <rect class="doc-rect" x="-28" y="-15" width="56" height="30" rx="6" />
      <text class="packet-text packet-text--sm" y="3.5">Transfer</text>
    </g>
    <g class="seal" id="j-seal" transform="translate(18 -14)">
      <circle class="seal-dot" r="9" />
      <path class="seal-check" d="M -3.5 0 L -1 3 L 4 -3.5" fill="none" />
    </g>
  </g>
</svg>

<style>
  /* Main packet positions per step */
  #j-packet { transform: translate(80px, 210px); }
  .player--s2 #j-packet { transform: translate(255px, 210px); }
  .player--s3 #j-packet,
  .player--s4 #j-packet { transform: translate(450px, 210px); }
  .player--s5 #j-packet { transform: translate(565px, 210px); }
  .player--s6 #j-packet { transform: translate(690px, 210px); }

  /* Signature seal: appears once the Generator signs (step 2) */
  .player--s2 #j-seal,
  .player--s3 #j-seal,
  .player--s4 #j-seal,
  .player--s5 #j-seal,
  .player--s6 #j-seal { transform: translate(18px, -14px) scale(1); }

  /* Raw log <-> transformed view cross-fade at the Lens gate (step 5) */
  #j-packet-raw,
  #j-packet-view { transition: opacity 0.3s ease; }
  #j-packet-view { opacity: 0; }
  .player--s5 #j-packet-raw,
  .player--s6 #j-packet-raw { opacity: 0; transition-delay: 0.4s; }
  .player--s5 #j-packet-view,
  .player--s6 #j-packet-view { opacity: 1; transition-delay: 0.4s; }

  /* Attestation card from step 3; GraphQL bubble + shield on the last step */
  .player--s3 #j-att-card,
  .player--s4 #j-att-card,
  .player--s5 #j-att-card,
  .player--s6 #j-att-card { opacity: 1; }

  #j-query,
  #j-shield { transition: opacity 0.45s ease 0.3s; }
  .player--s6 #j-query,
  .player--s6 #j-shield { opacity: 1; }

  .shield-body {
    fill: color-mix(in srgb, var(--color-primary) 12%, var(--background));
    stroke: var(--color-primary);
    stroke-width: 1.5;
  }
  .shield-check {
    stroke: var(--color-primary);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
