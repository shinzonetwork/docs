name: Zenhub PR Connector

on:
  workflow_call:
    secrets:
      ZENHUB_API_KEY:
        required: true
      GITHUB_CROSS_REPO_TOKEN:
        required: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  connect:
    name: Connect closing issues to PR in Zenhub
    runs-on: ubuntu-latest

    steps:
      - name: Connect GitHub closing issues to Zenhub PR
        env:
          ZENHUB_TOKEN: ${{ secrets.ZENHUB_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_CROSS_REPO_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          CURRENT_OWNER: ${{ github.repository_owner }}
          CURRENT_REPO: ${{ github.event.repository.name }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Finding GitHub closing-keyword issue references..."

          mapfile -t REFERENCES < <(
            python3 - <<'PY'
            import os
            import re

            body = os.environ.get("PR_BODY", "")
            current_repo = f'{os.environ["CURRENT_OWNER"]}/{os.environ["CURRENT_REPO"]}'
            references = set()

            keyword = r"\b(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\b"

            pattern = re.compile(
                rf"""
                {keyword}
                \s+
                (?:
                    https?://github\.com/(?P<url_owner>[^/\s]+)/(?P<url_repo>[^/\s]+)/issues/(?P<url_number>\d+)
                    |
                    (?P<cross_owner>[\w.-]+)/(?P<cross_repo>[\w.-]+)\#(?P<cross_number>\d+)
                    |
                    \#(?P<local_number>\d+)
                )
                """,
                re.IGNORECASE | re.VERBOSE,
            )

            for match in pattern.finditer(body):
                if match.group("url_number"):
                    repository = f'{match.group("url_owner")}/{match.group("url_repo")}'
                    number = match.group("url_number")
                elif match.group("cross_number"):
                    repository = f'{match.group("cross_owner")}/{match.group("cross_repo")}'
                    number = match.group("cross_number")
                else:
                    repository = current_repo
                    number = match.group("local_number")

                references.add((repository, number))

            for repository, number in sorted(references):
                print(f"{repository}\t{number}")
            PY
          )

          if [ "${#REFERENCES[@]}" -eq 0 ]; then
            echo "No GitHub closing-keyword issue references found; nothing to connect."
            exit 0
          fi

          echo "Found ${#REFERENCES[@]} issue reference(s)."

          connected=0
          unresolved=0

          for REFERENCE in "${REFERENCES[@]}"; do
            IFS=$'\t' read -r TARGET_REPOSITORY ISSUE_NUMBER <<< "$REFERENCE"

            TARGET_OWNER="${TARGET_REPOSITORY%%/*}"
            TARGET_REPO="${TARGET_REPOSITORY##*/}"

            echo "::group::Inspecting $TARGET_REPOSITORY#$ISSUE_NUMBER"

            GITHUB_QUERY=$(
              jq -nc \
                --arg owner "$TARGET_OWNER" \
                --arg repo "$TARGET_REPO" \
                --argjson number "$ISSUE_NUMBER" \
                '{
                  query: "query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issueOrPullRequest(number: $number) {
                        __typename
                        ... on Issue {
                          id
                          number
                          title
                        }
                        ... on PullRequest {
                          id
                          number
                          title
                        }
                      }
                    }
                  }",
                  variables: {
                    owner: $owner,
                    repo: $repo,
                    number: $number
                  }
                }'
            )

            GITHUB_RESPONSE=$(
              curl --fail-with-body --silent --show-error \
                --retry 3 \
                --retry-delay 2 \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$GITHUB_QUERY" \
                https://api.github.com/graphql
            )

            if jq -e '(.errors // []) | length > 0' >/dev/null <<< "$GITHUB_RESPONSE"; then
              echo "GitHub GraphQL error:"
              jq '.errors' <<< "$GITHUB_RESPONSE"
              echo "::endgroup::"
              exit 1
            fi

            OBJECT_TYPE=$(
              jq -r '.data.repository.issueOrPullRequest.__typename // empty' \
                <<< "$GITHUB_RESPONSE"
            )

            ISSUE_NODE_ID=$(
              jq -r '.data.repository.issueOrPullRequest.id // empty' \
                <<< "$GITHUB_RESPONSE"
            )

            ISSUE_TITLE=$(
              jq -r '.data.repository.issueOrPullRequest.title // empty' \
                <<< "$GITHUB_RESPONSE"
            )

            if [ "$OBJECT_TYPE" = "PullRequest" ]; then
              echo "::warning::Skipping $TARGET_REPOSITORY#$ISSUE_NUMBER: it is a pull request, not an issue."
              echo "::endgroup::"
              continue
            fi

            if [ "$OBJECT_TYPE" != "Issue" ] || [ -z "$ISSUE_NODE_ID" ]; then
              echo "::warning::Skipping $TARGET_REPOSITORY#$ISSUE_NUMBER: issue not found or inaccessible."
              unresolved=$((unresolved + 1))
              echo "::endgroup::"
              continue
            fi

            echo "Connecting issue $TARGET_REPOSITORY#$ISSUE_NUMBER: $ISSUE_TITLE"

            ZENHUB_MUTATION=$(
              jq -nc \
                --arg issueId "$ISSUE_NODE_ID" \
                --arg pullRequestId "$PR_NODE_ID" \
                '{
                  query: "mutation($issueId: ID!, $pullRequestId: ID!) {
                    connectIssueAndPullRequest(
                      input: {
                        issueId: $issueId,
                        pullRequestId: $pullRequestId
                      }
                    ) {
                      issue { id }
                      pullRequest { id }
                    }
                  }",
                  variables: {
                    issueId: $issueId,
                    pullRequestId: $pullRequestId
                  }
                }'
            )

            ZENHUB_RESPONSE=$(
              curl --fail-with-body --silent --show-error \
                --retry 3 \
                --retry-delay 2 \
                -X POST \
                -H "Authorization: Bearer $ZENHUB_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$ZENHUB_MUTATION" \
                https://api.zenhub.com/public/graphql
            )

            if jq -e '(.errors // []) | length > 0' >/dev/null <<<
