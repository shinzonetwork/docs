# Cloudflare Pages configuration
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "shinzo-docs"
pages_build_output_dir = "public"

[vars]
# Must be 0.22.0 or later: config.toml uses [markdown.highlighting] and extra_grammars, introduced in Zola 0.22.0. Older Zola versions ignore these settings and build the site without syntax highlighting.
ZOLA_VERSION = "0.22.1"
